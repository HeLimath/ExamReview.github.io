<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>2026학년도 3학년 1학기 중간시험 오답노트</title>
    <style>
        :root { --primary-color: #2c3e50; --bg-color: #f0f2f5; }
        body { 
            margin: 0; padding: 0;
            background-color: var(--bg-color); 
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; 
            display: flex; flex-direction: column; height: 100vh;
            /* 전 영역 드래그 및 복제 방지 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            /* iOS 롱탭 메뉴 방지 */
            -webkit-touch-callout: none;
        }
        
        header { 
            background-color: var(--primary-color); color: white; padding: 12px 10px; 
            text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.15); z-index: 20;
        }
        h1 { margin: 0; font-size: 1.1rem; word-break: keep-all; }

        main { 
            flex: 1; overflow-y: auto; padding: 10px 5px; 
            display: flex; justify-content: center; align-items: flex-start;
            position: relative;
        }

        .pdf-viewer { 
            max-width: 900px; width: 100%; background: white; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 4px;
            position: relative; /* 보호막의 기준점 */
        }

        /* 🛡️ 핵심: 투명 보호막 (이미지 위를 덮어서 롱탭 방지) */
        .guard-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 15; /* 이미지보다 위에 위치 */
            background: rgba(255, 255, 255, 0); /* 투명 */
        }

        .pdf-page { display: none; width: 100%; }
        .pdf-page.active { display: block; }
        .pdf-page img { 
            width: 100%; height: auto; display: block; 
            pointer-events: none; /* 이미지 자체의 클릭 이벤트 무시 */
            -webkit-user-drag: none;
        }

        nav { 
            background-color: white; border-top: 1px solid #ccc; padding: 12px 10px; 
            display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
            z-index: 20;
        }
        .page-num { 
            width: 42px; height: 42px; border: 1px solid #bbb; 
            background-color: #fff; color: #333;
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; border-radius: 5px; font-weight: bold; 
        }
        .page-num.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

        @media (min-width: 600px) {
            header { padding: 15px; } h1 { font-size: 1.25rem; }
            main { padding: 20px; } .page-num { width: 45px; height: 45px; border-radius: 50%; }
        }
    </style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

<header>
    <h1>[2026학년도 3학년 1학기 중간시험 오답노트]</h1>
</header>

<main>
    <div class="pdf-viewer">
        <!-- 보호막 레이어 -->
        <div class="guard-layer"></div>
        
        <!-- 시험지 이미지들 -->
        <div id="page-1" class="pdf-page active"><img src="page1.png" alt="1페이지"></div>
        <div id="page-2" class="pdf-page"><img src="page2.png" alt="2페이지"></div>
        <div id="page-3" class="pdf-page"><img src="page3.png" alt="3페이지"></div>
        <div id="page-4" class="pdf-page"><img src="page4.png" alt="4페이지"></div>
        <div id="page-5" class="pdf-page"><img src="page5.png" alt="5페이지"></div>
        <div id="page-6" class="pdf-page"><img src="page6.png" alt="6페이지"></div>
    </div>
</main>

<nav>
    <div class="page-num active" onclick="changePage(1)">1</div>
    <div class="page-num" onclick="changePage(2)">2</div>
    <div class="page-num" onclick="changePage(3)">3</div>
    <div class="page-num" onclick="changePage(4)">4</div>
    <div class="page-num" onclick="changePage(5)">5</div>
    <div class="page-num" onclick="changePage(6)">6</div>
</nav>

<script>
    function changePage(num) {
        document.querySelectorAll('.pdf-page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.page-num').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + num).classList.add('active');
        document.querySelectorAll('.page-num')[num - 1].classList.add('active');
        document.querySelector('main').scrollTop = 0;
    }
</script>
</body>
</html>
