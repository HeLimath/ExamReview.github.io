<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>2026학년도 3학년 1학기 중간시험 오답노트</title>
    <style>
        :root { --primary-color: #2c3e50; --bg-color: #ffffff; /* 배경을 흰색으로 통일하여 간격 제거 */ }
        body { 
            margin: 0; padding: 0;
            background-color: var(--bg-color); 
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; 
            display: flex; flex-direction: column; 
            /* 모바일 브라우저 높이 대응 */
            height: 100vh; height: 100dvh; 
            overflow: hidden;
            -webkit-user-select: none; -webkit-touch-callout: none;
        }
        
        header { 
            background-color: var(--primary-color); color: white; padding: 12px 10px; 
            text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.15); z-index: 30;
        }
        h1 { margin: 0; font-size: 1.1rem; word-break: keep-all; }

        main { 
            flex: 1; overflow-y: auto; 
            padding: 0; /* 여백 완전 제거 */
            display: flex; flex-direction: column; align-items: center;
            position: relative;
            background-color: #ffffff;
            /* 하단 바 높이만큼 바닥 공간 확보 */
            padding-bottom: 70px; 
        }

        .pdf-viewer { 
            width: 100%; max-width: 800px; 
            background: white; position: relative;
        }

        /* 투명 보호막 (롱탭 방지) */
        .guard-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 15; background: rgba(255, 255, 255, 0);
        }

        .pdf-page { display: none; width: 100%; }
        .pdf-page.active { display: block; }
        .pdf-page img { 
            width: 100%; height: auto; display: block; 
            pointer-events: none; -webkit-user-drag: none;
        }

        /* ❗ 하단 네비게이션바를 화면 하단에 고정 */
        nav { 
            position: fixed; bottom: 0; left: 0; right: 0;
            background-color: rgba(255, 255, 255, 0.95); /* 살짝 투명한 흰색 */
            border-top: 1px solid #eee; 
            padding: 10px 0 calc(env(safe-area-inset-bottom) + 10px) 0; 
            display: flex; justify-content: center; gap: 12px;
            z-index: 40;
            box-shadow: 0 -3px 10px rgba(0,0,0,0.05);
        }

        .page-num { 
            width: 44px; height: 44px; 
            border: 1px solid #ccc; background-color: #fff; color: #333;
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; border-radius: 8px; font-weight: bold; font-size: 1.1rem;
        }
        .page-num.active { 
            background-color: var(--primary-color); color: white; border-color: var(--primary-color); 
        }

        @media (min-width: 600px) {
            h1 { font-size: 1.25rem; }
            .page-num { width: 48px; height: 48px; border-radius: 50%; }
        }
    </style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

<header>
    <h1>[2026학년도 3학년 1학기 중간시험 오답노트]</h1>
</header>

<main>
    <div class="pdf-viewer">
        <div class="guard-layer"></div>
        <div id="page-1" class="pdf-page active"><img src="page1.png" alt="1페이지"></div>
        <div id="page-2" class="pdf-page"><img src="page2.png" alt="2페이지"></div>
        <div id="page-3" class="pdf-page"><img src="page3.png" alt="3페이지"></div>
        <div id="page-4" class="pdf-page"><img src="page4.png" alt="4페이지"></div>
        <div id="page-5" class="pdf-page"><img src="page5.png" alt="5페이지"></div>
        <div id="page-6" class="pdf-page"><img src="page6.png" alt="6페이지"></div>
    </div>
</main>

<nav>
    <div class="page-num active" onclick="changePage(1)">1</div>
    <div class="page-num" onclick="changePage(2)">2</div>
    <div class="page-num" onclick="changePage(3)">3</div>
    <div class="page-num" onclick="changePage(4)">4</div>
    <div class="page-num" onclick="changePage(5)">5</div>
    <div class="page-num" onclick="changePage(6)">6</div>
</nav>

<script>
    function changePage(num) {
        document.querySelectorAll('.pdf-page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.page-num').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + num).classList.add('active');
        document.querySelectorAll('.page-num')[num - 1].classList.add('active');
        // 페이지 변경 시 맨 위로 스크롤
        document.querySelector('main').scrollTo({top: 0, behavior: 'instant'});
    }
</script>
</body>
</html>
