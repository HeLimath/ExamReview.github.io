<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026학년도 3학년 1학기 중간시험 오답노트</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --highlight-color: #e74c3c;
            --bg-color: #f0f2f5;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }
        h1 {
            margin: 0;
            font-size: 1.25rem;
        }
        /* 이미지 노출 영역 */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 20px;
        }
        .pdf-viewer {
            max-width: 900px;
            width: 100%;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }
        .pdf-page {
            display: none;
            width: 100%;
        }
        .pdf-page.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        .pdf-page img {
            width: 100%;
            height: auto;
            display: block;
        }
        /* 하단 네비게이션 */
        nav {
            background-color: white;
            border-top: 2px solid var(--primary-color);
            padding: 15px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .page-num {
            width: 40px;
            height: 40px;
            border: 2px solid #ddd;
            background: white;
            color: #333;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .page-num:hover {
            border-color: var(--primary-color);
            background-color: #f8f9fa;
        }
        .page-num.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: scale(1.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @media (max-width: 600px) {
            .page-num { width: 35px; height: 35px; font-size: 0.9rem; }
            nav { gap: 8px; }
        }
    </style>
</head>
<body>

<header>
    <h1>[2026학년도 3학년 1학기 중간시험 오답노트]</h1>
</header>

<main>
    <div class="pdf-viewer">
        <!-- 이미지 파일명은 page1.jpg, page2.jpg 등으로 준비해주세요 -->
        <div id="page-1" class="pdf-page active"><img src="page1.jpg" alt="1페이지"></div>
        <div id="page-2" class="pdf-page"><img src="page2.jpg" alt="2페이지"></div>
        <div id="page-3" class="pdf-page"><img src="page3.jpg" alt="3페이지"></div>
        <div id="page-4" class="pdf-page"><img src="page4.jpg" alt="4페이지"></div>
        <div id="page-5" class="pdf-page"><img src="page5.jpg" alt="5페이지"></div>
        <div id="page-6" class="pdf-page"><img src="page6.jpg" alt="6페이지"></div>
    </div>
</main>

<nav>
    <div class="page-num active" onclick="changePage(1)">1</div>
    <div class="page-num" onclick="changePage(2)">2</div>
    <div class="page-num" onclick="changePage(3)">3</div>
    <div class="page-num" onclick="changePage(4)">4</div>
    <div class="page-num" onclick="changePage(5)">5</div>
    <div class="page-num" onclick="changePage(6)">6</div>
</nav>

<script>
    function changePage(num) {
        // 모든 페이지 숨기기
        document.querySelectorAll('.pdf-page').forEach(page => {
            page.classList.remove('active');
        });
        // 모든 버튼 비활성화
        document.querySelectorAll('.page-num').forEach(btn => {
            btn.classList.remove('active');
        });

        // 선택한 페이지 및 버튼 활성화
        document.getElementById('page-' + num).classList.add('active');
        document.querySelectorAll('.page-num')[num - 1].classList.add('active');

        // 페이지 전환 시 상단으로 스크롤
        document.querySelector('main').scrollTop = 0;
    }
</script>

</body>
</html>
