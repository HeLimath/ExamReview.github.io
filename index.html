<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <!-- 모바일 환경에서 화면 비율 최적화 및 핀치 줌 허용 -->
    <title>2026학년도 3학년 1학기 중간시험 오답노트</title>
    <style>
        :root { --primary-color: #2c3e50; --bg-color: #f0f2f5; }
        body { 
            margin: 0; 
            padding: 0;
            background-color: var(--bg-color); 
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            /* 텍스트/이미지 드래그 및 선택 방지 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* 상단 제목 영역 */
        header { 
            background-color: var(--primary-color); 
            color: white; 
            padding: 12px 10px; /* 모바일에서 위아래 패딩 약간 줄임 */
            text-align: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            z-index: 10;
        }
        h1 { 
            margin: 0; 
            font-size: 1.1rem; /* 모바일에서 글씨 크기 조정 */
            font-weight: 600;
            word-break: keep-all; /* 단어 단위로 줄바꿈 방지 */
        }

        /* 메인 콘텐츠 영역 (시험지 이미지) */
        main { 
            flex: 1; 
            overflow-y: auto; 
            /* 모바일에서 이미지가 화면 양쪽 끝까지 차도록 좌우 패딩을 줄임 */
            padding: 10px 5px; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
        }
        .pdf-viewer { 
            max-width: 900px; 
            width: 100%; 
            background: white; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
            border-radius: 4px; /* 테두리를 부드럽게 */
            overflow: hidden;
        }
        .pdf-page { display: none; width: 100%; }
        .pdf-page.active { display: block; }
        .pdf-page img { 
            width: 100%; 
            height: auto; 
            display: block; 
            -webkit-user-drag: none; /* 이미지 드래그 방지 */
        }

        /* 하단 네비게이션 버튼 영역 */
        nav { 
            background-color: white; 
            border-top: 1px solid #ccc; 
            padding: 12px 10px; /* 터치하기 편하도록 위아래 여백 확보 */
            display: flex; 
            justify-content: center; 
            gap: 8px; /* 모바일에서는 버튼 간격을 조금 좁힘 */
            flex-wrap: wrap; /* 화면이 작아지면 여러 줄로 표시되도록 허용 */
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
            z-index: 10;
        }
        .page-num { 
            width: 42px; /* 손가락 터치 영역 최소 기준(약 40px) 이상 확보 */
            height: 42px; 
            border: 1px solid #bbb; 
            background-color: #fff;
            color: #333;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            border-radius: 5px; /* 동그라미 대신 둥근 사각형으로 터치 영역 확대 */
            font-weight: bold; 
            font-size: 1.1rem;
            transition: background-color 0.2s, color 0.2s;
        }
        .page-num.active { 
            background-color: var(--primary-color); 
            color: white; 
            border-color: var(--primary-color); 
        }

        /* PC 화면 등 큰 화면(가로 600px 이상)일 때의 설정 */
        @media (min-width: 600px) {
            header { padding: 15px; }
            h1 { font-size: 1.25rem; }
            main { padding: 20px; }
            nav { gap: 15px; padding: 15px 0; }
            .page-num { width: 45px; height: 45px; border-radius: 50%; /* PC에서는 원래대로 원형 */ font-size: 1.2rem; }
            .page-num:hover { background-color: #e9ecef; }
        }
    </style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

<header>
    <h1>[2026학년도 3학년 1학기 중간시험 오답노트]</h1>
</header>

<main>
    <div class="pdf-viewer">
        <div id="page-1" class="pdf-page active"><img src="page1.png" alt="1페이지"></div>
        <div id="page-2" class="pdf-page"><img src="page2.png" alt="2페이지"></div>
        <div id="page-3" class="pdf-page"><img src="page3.png" alt="3페이지"></div>
        <div id="page-4" class="pdf-page"><img src="page4.png" alt="4페이지"></div>
        <div id="page-5" class="pdf-page"><img src="page5.png" alt="5페이지"></div>
        <div id="page-6" class="pdf-page"><img src="page6.png" alt="6페이지"></div>
    </div>
</main>

<nav>
    <div class="page-num active" onclick="changePage(1)">1</div>
    <div class="page-num" onclick="changePage(2)">2</div>
    <div class="page-num" onclick="changePage(3)">3</div>
    <div class="page-num" onclick="changePage(4)">4</div>
    <div class="page-num" onclick="changePage(5)">5</div>
    <div class="page-num" onclick="changePage(6)">6</div>
</nav>

<script>
    function changePage(num) {
        document.querySelectorAll('.pdf-page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.page-num').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + num).classList.add('active');
        document.querySelectorAll('.page-num')[num - 1].classList.add('active');
        // 페이지 변경 시 상단으로 스크롤 이동
        document.querySelector('main').scrollTop = 0;
    }

    // 모바일 환경을 위한 추가 보안 (꾹 눌러서 이미지 저장/공유 뜨는 것 차단 시도)
    document.addEventListener('contextmenu', event => event.preventDefault());
</script>
</body>
</html>
